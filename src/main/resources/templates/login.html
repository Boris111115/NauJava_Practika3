<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Вход</title></head>
<body>
<h1>Вход в систему</h1>
<p th:if="${param.error}" style="color:#b00020">Неверное имя пользователя или пароль.</p>
<p th:if="${param.logout}">Вы вышли из системы.</p>
<p th:if="${param.registered}">Регистрация прошла успешно. Теперь войдите.</p>
<form th:action="@{/login}" method="post">
  <label>Имя пользователя <input type="text" name="username" autocomplete="username" required></label><br><br>
  <label>Пароль <input type="password" name="password" autocomplete="current-password" required></label><br><br>
  <button type="submit">Войти</button>
</form>
<p><a th:href="@{/registration}">Зарегистрироваться</a></p>
</body>
</html>
